name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: flutter create --org com.example --project-name calligraphy_app .

      - name: Update pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: calligraphy_app
          description: Calligraphy and image clipboard app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.1.2
            image: ^4.2.0
            path_provider: ^2.1.4

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

      - name: Update lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:image/image.dart' as img;
          import 'package:path_provider/path_provider.dart';

          void main() {
            runApp(const CalligraphyClipboardApp());
          }

          class CalligraphyClipboardApp extends StatelessWidget {
            const CalligraphyClipboardApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'خطاطی کلپ بورڈ',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.black),
                  useMaterial3: true,
                ),
                home: const CalligraphyHomeScreen(),
              );
            }
          }

          class CalligraphyHomeScreen extends StatefulWidget {
            const CalligraphyHomeScreen({super.key});

            @override
            State<CalligraphyHomeScreen> createState() => _CalligraphyHomeScreenState();
          }

          class _CalligraphyHomeScreenState extends State<CalligraphyHomeScreen> {
            static const MethodChannel _channel =
                MethodChannel('com.example.calligraphy_app/clipboard');

            final TextEditingController _textController = TextEditingController(
              text: 'رکن الدین بیبرس',
            );
            final GlobalKey _textCaptureKey = GlobalKey();

            double _fontSize = 48.0;
            Uint8List? _processedImageBytes;
            bool _isProcessing = false;

            Future<void> _pickAndRemoveWhiteBg() async {
              final picker = ImagePicker();
              final XFile? pickedFile = await picker.pickImage(source: ImageSource.gallery);
              if (pickedFile == null) return;

              setState(() => _isProcessing = true);

              try {
                final rawBytes = await pickedFile.readAsBytes();
                img.Image? decoded = img.decodeImage(rawBytes);

                if (decoded != null) {
                  decoded = img.Image.from(decoded, numChannels: 4);

                  for (int y = 0; y < decoded.height; y++) {
                    for (int x = 0; x < decoded.width; x++) {
                      final pixel = decoded.getPixel(x, y);
                      final r = pixel.r;
                      final g = pixel.g;
                      final b = pixel.b;

                      if (r > 235 && g > 235 && b > 235) {
                        decoded.setPixelRgba(x, y, r, g, b, 0);
                      }
                    }
                  }

                  final pngBytes = Uint8List.fromList(img.encodePng(decoded));
                  setState(() {
                    _processedImageBytes = pngBytes;
                  });
                  _showMessage('تصویر کا بیک گراؤنڈ شفاف کر دیا گیا ہے');
                }
              } catch (e) {
                _showMessage('تصویر پروسیس کرنے میں مسئلہ آیا: $e');
              } finally {
                setState(() => _isProcessing = false);
              }
            }

            Future<Uint8List?> _captureTextAsPng() async {
              try {
                final boundary =
                    _textCaptureKey.currentContext?.findRenderObject() as RenderRepaintBoundary?;
                if (boundary == null) return null;

                final ui.Image image = await boundary.toImage(pixelRatio: 3.0);
                final ByteData? byteData =
                    await image.toByteData(format: ui.ImageByteFormat.png);
                return byteData?.buffer.asUint8List();
              } catch (e) {
                _showMessage('ٹیکسٹ کو تصویر میں بدلنے میں مسئلہ آیا: $e');
                return null;
              }
            }

            Future<void> _copyImageToClipboard() async {
              setState(() => _isProcessing = true);
              try {
                Uint8List? bytes = _processedImageBytes;
                bytes ??= await _captureTextAsPng();

                if (bytes == null) {
                  _showMessage('کاپی کرنے کے لیے کوئی تصویر یا متن موجود نہیں ہے');
                  return;
                }

                final tempDir = await getTemporaryDirectory();
                final file = File(
                  '${tempDir.path}/calligraphy_${DateTime.now().millisecondsSinceEpoch}.png',
                );
                await file.writeAsBytes(bytes);

                await _channel.invokeMethod('copyImagePath', {'path': file.path});
                _showMessage('تصویر اصل سائز میں کلپ بورڈ پر کاپی ہو گئی ہے! اب پیسٹ کریں');
              } catch (e) {
                _showMessage('کاپی کرتے وقت مسئلہ آیا: $e');
              } finally {
                setState(() => _isProcessing = false);
              }
            }

            void _showMessage(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(msg, textDirection: TextDirection.rtl)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  backgroundColor: const Color(0xFFF4F4F4),
                  appBar: AppBar(
                    title: const Text('خطاطی و تصویر کلپ بورڈ'),
                    centerTitle: true,
                  ),
                  body: SingleChildScrollView(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        TextField(
                          controller: _textController,
                          onChanged: (_) => setState(() {}),
                          decoration: const InputDecoration(
                            labelText: 'یہاں عربی یا اردو متن لکھیں',
                            border: OutlineInputBorder(),
                            filled: true,
                            fillColor: Colors.white,
                          ),
                        ),
                        const SizedBox(height: 12),
                        Row(
                          children: [
                            const Text('سائز: '),
                            Expanded(
                              child: Slider(
                                value: _fontSize,
                                min: 24,
                                max: 110,
                                onChanged: (val) => setState(() => _fontSize = val),
                              ),
                            ),
                            Text(_fontSize.toInt().toString()),
                          ],
                        ),
                        const SizedBox(height: 10),
                        Container(
                          height: 220,
                          decoration: BoxDecoration(
                            color: Colors.white,
                            border: Border.all(color: Colors.black26),
                            borderRadius: BorderRadius.circular(12),
                          ),
                          alignment: Alignment.center,
                          child: _isProcessing
                              ? const CircularProgressIndicator()
                              : _processedImageBytes != null
                                  ? Image.memory(
                                      _processedImageBytes!,
                                      fit: BoxFit.contain,
                                    )
                                  : RepaintBoundary(
                                      key: _textCaptureKey,
                                      child: Padding(
                                        padding: const EdgeInsets.all(12),
                                        child: Text(
                                          _textController.text,
                                          textAlign: TextAlign.center,
                                          style: TextStyle(
                                            fontSize: _fontSize,
                                            color: Colors.black,
                                            fontWeight: FontWeight.bold,
                                          ),
                                        ),
                                      ),
                                    ),
                        ),
                        const SizedBox(height: 16),
                        OutlinedButton.icon(
                          onPressed: _pickAndRemoveWhiteBg,
                          icon: const Icon(Icons.image),
                          label: const Text('گیلری سے تصویر لیں (سفید بیک گراؤنڈ ہٹائیں)'),
                        ),
                        const SizedBox(height: 10),
                        if (_processedImageBytes != null)
                          TextButton(
                            onPressed: () => setState(() => _processedImageBytes = null),
                            child: const Text('ٹیکسٹ موڈ پر واپس جائیں'),
                          ),
                        const SizedBox(height: 12),
                        ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.black,
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 14),
                          ),
                          onPressed: _isProcessing ? null : _copyImageToClipboard,
                          icon: const Icon(Icons.copy),
                          label: const Text('تصویر اصل سائز میں کلپ بورڈ پر کاپی کریں'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Add Android Clipboard handler
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/calligraphy_app
          mkdir -p android/app/src/main/res/xml

          cat << 'EOF' > android/app/src/main/kotlin/com/example/calligraphy_app/MainActivity.kt
          package com.example.calligraphy_app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.example.calligraphy_app/clipboard"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "copyImagePath") {
                          val path = call.argument<String>("path")
                          if (path != null) {
                              val file = File(path)
                              val uri = FileProvider.getUriForFile(
                                  this,
                                  "${applicationContext.packageName}.fileprovider",
                                  file
                              )
                              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val clip = ClipData.newUri(contentResolver, "Calligraphy Image", uri)
                              clipboard.setPrimaryClip(clip)
                              result.success(true)
                          } else {
                              result.error("INVALID_PATH", "Path is null", null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <external-cache-path name="external_cache" path="." />
          </paths>
          EOF

          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          """
          if "androidx.core.content.FileProvider" not in content:
              content = content.replace("</application>", provider + "\n    </application>")
              with open(path, "w") as f:
                  f.write(content)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calligraphy-clipboard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
